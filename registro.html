<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <div class="formulario">
        <h1> Regístrate</h1>
        <form id="form-registro" novalidate>
            <div class="username">
                <input type="text" id="nombre" name="nombre" placeholder=" " autocomplete="name" required
                    aria-describedby="error-nombre registro-error">
                <label for="nombre"> Nombre de usuario</label>
            </div>
            <p class="campo-error campo-error-campo" id="error-nombre" hidden></p>
            <div class="correo">
                <input type="email" id="correo" name="correo" placeholder=" " autocomplete="email" required
                    aria-describedby="error-correo registro-error">
                <label for="correo"> Mail</label>
            </div>
            <p class="campo-error campo-error-campo" id="error-correo" hidden></p>
            <div class="password">
                <input type="password" id="contrasena" name="contrasena" placeholder=" " autocomplete="new-password"
                    required aria-describedby="error-contrasena registro-error">
                <label for="contrasena"> Contraseña</label>
            </div>
            <p class="campo-error campo-error-campo" id="error-contrasena" hidden></p>
            <div class="password">
                <input type="password" id="confirmar-contrasena" name="confirmarContrasena" placeholder=" "
                    autocomplete="new-password" required
                    aria-describedby="error-confirmar registro-error">
                <label for="confirmar-contrasena"> Confirmar Contraseña</label>
            </div>
            <p class="campo-error campo-error-campo" id="error-confirmar" hidden></p>
            <p class="login-estado" id="registro-estado" role="status" aria-live="polite"></p>
            <div class="campo-error" id="registro-error" role="alert" hidden></div>
            <input type="submit" value="Registrarse">
        </form>
        <div class="registro">
            <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
        </div>
    </div>

    <script type="module" src="/js/registro.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>

</html>
