<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuracion</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>



    <!--configuracion -->
    <div class="container">
        <div id="nav-root"></div>


        <!-- detalles -->
        <div class="detalles">
            <!-- panel de configuraciones -->
            <div class="ordenes-recientes">
                <div class="header">
                    <h2>Panel de configuraciones</h2>
                </div>
                <table>
                    <tbody>
                        <tr>
                            <td>Editar nombre de la cuenta</td>
                            <td><input type="text" placeholder="Usuario 1"></td>
                        </tr>
                        <tr>
                            <td>Cambiar contraseña</td>
                            <td><input type="password" placeholder="Contraseña"></td>
                        </tr>
                        <tr>
                            <td>Cambiar correo</td>
                            <td><input type="text" placeholder="Correo Electronico"></td>
                        </tr>

                        <tr>
                            <td>Modo oscuro</td>
                            <td><input type="checkbox" name="" id=""></td>
                        </tr>
                        <tr>
                            <td>Eliminar cuenta</td>
                            <td><button>Eliminar</button></td>
                        </tr>

                    </tbody>
                </table>
            </div>
            <!-- Fin Clientes activos -->

            <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
            <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
            <script type="module" src="js/index.js"></script>

    <script type="module" src="/js/main.js"></script>

</html>
