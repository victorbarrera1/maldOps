<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuracion</title>
    <link rel="icon" type="image/png" href="img/logo-maldops.png">
    <link rel="stylesheet" href="src/css/dashboard.css">
</head>

<body data-privada="true">



    <!--configuracion -->
    <div class="container">
        <div id="nav-root"></div>


        <!-- detalles -->
        <div class="detalles">
            <!-- panel de configuraciones -->
            <div class="ordenes-recientes">
                <div class="header">
                    <h2>Panel de configuraciones</h2>
                </div>
                <!-- [IA] inicio · ia/2026-11-12_victorbarrera1_cliente-detalle.md -->
                <form id="form-cuenta" novalidate>
                <table>
                    <tbody>
                        <!-- [IA] inicio · ia/2026-11-11_victorbarrera1_cuenta-orden-readme.md -->
                        <tr>
                            <td><label for="cuenta-nombre">Editar nombre de la cuenta</label></td>
                            <td>
                                <input class="input" type="text" id="cuenta-nombre" placeholder="Usuario 1" autocomplete="name" aria-describedby="cuenta-error-nombre">
                                <p class="campo-error" id="cuenta-error-nombre" hidden></p>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="cuenta-correo">Cambiar correo</label></td>
                            <td>
                                <input class="input" type="email" id="cuenta-correo" placeholder="Correo Electronico" autocomplete="email" aria-describedby="cuenta-error-correo">
                                <p class="campo-error" id="cuenta-error-correo" hidden></p>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="cuenta-contrasena-actual">Contraseña actual</label></td>
                            <td>
                                <input class="input" type="password" id="cuenta-contrasena-actual" placeholder="Solo si vas a cambiarla" autocomplete="current-password" aria-describedby="cuenta-error-contrasena-actual">
                                <p class="campo-error" id="cuenta-error-contrasena-actual" hidden></p>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="cuenta-contrasena-nueva">Cambiar contraseña</label></td>
                            <td>
                                <input class="input" type="password" id="cuenta-contrasena-nueva" placeholder="Contraseña nueva (mínimo 6)" autocomplete="new-password" aria-describedby="cuenta-error-contrasena-nueva">
                                <p class="campo-error" id="cuenta-error-contrasena-nueva" hidden></p>
                            </td>
                        </tr>
                        <tr>
                            <td>Guardar cambios de la cuenta</td>
                            <td>
                                <button type="submit" class="btn btn-primary" id="guardar-cuenta">Guardar cambios</button>
                                <p id="cuenta-aviso" class="text-sm" role="status" aria-live="polite" aria-atomic="true"></p>
                            </td>
                        </tr>

                        <tr>
                            <td><label for="modo-oscuro">Modo oscuro</label></td>
                            <td><input type="checkbox" id="modo-oscuro"></td>
                        </tr>
                        <tr>
                            <td>Eliminar cuenta</td>
                            <td><button type="button" class="btn btn-danger" id="eliminar-cuenta">Eliminar</button></td>
                        </tr>
                        <!-- [IA] fin -->

                    </tbody>
                </table>
                </form>
                <!-- [IA] fin -->
            </div>
            <!-- Fin Clientes activos -->

            <!-- [IA] inicio · ia/2026-11-11_victorbarrera1_cuenta-orden-readme.md -->
            <dialog id="confirmar-dialogo" class="modal" aria-labelledby="confirmar-titulo">
                <form method="dialog">
                    <h2 id="confirmar-titulo">Confirmar eliminación</h2>
                    <p class="estado-detalle" id="confirmar-mensaje"></p>
                    <div class="modal-acciones">
                        <button type="submit" class="btn" value="cancelar">Cancelar</button>
                        <button type="submit" class="btn btn-danger" value="confirmar">Eliminar</button>
                    </div>
                </form>
            </dialog>
            <!-- [IA] fin -->

            <!-- Simulador de pruebas -->
            <div class="nuevos-clientes">
                <div class="header">
                    <h2>Simulador de pruebas</h2>
                </div>
                <form id="form-simulador" class="mt-4 space-y-3" novalidate>
                    <div id="simulador-estado"></div>
                    <div id="simulador-contenido" hidden>
                        <div>
                            <label class="label" for="latencia">Latencia de la API</label>
                            <select class="input" id="latencia" name="latencia">
                                <option value="normal">Normal (300–800 ms)</option>
                                <option value="rapida">Rápida (0–150 ms)</option>
                                <option value="lenta">Lenta (1200–1800 ms)</option>
                            </select>
                        </div>
                        <div>
                            <label class="label" for="probabilidad-error">Probabilidad de error</label>
                            <select class="input" id="probabilidad-error" name="probabilidadError">
                                <option value="0">0 %</option>
                                <option value="10">10 %</option>
                                <option value="25">25 %</option>
                                <option value="50">50 %</option>
                            </select>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary" id="guardar-simulador">
                                Guardar configuración
                            </button>
                            <button type="button" class="btn" id="simular-fallo">
                                Simular siguiente error
                            </button>
                            <button type="button" class="btn btn-danger" id="reiniciar-datos">
                                Restablecer datos de prueba
                            </button>
                        </div>
                        <p id="simulador-aviso" class="text-sm" role="status" aria-live="polite"></p>
                    </div>
                </form>
            </div>
            <!-- Fin Simulador de pruebas -->

    <script type="module" src="/src/guard.js"></script>
    <script type="module" src="/src/configuracion.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
