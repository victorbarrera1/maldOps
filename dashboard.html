<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- estilos css -->
    <link rel="stylesheet" href="src/css/dashboard.css">
    <title> Maldops - Dashboard </title>
</head>

<body data-privada="true">

    <section>

        <!--dashboard -->
        <div class="container">
            <div id="nav-root"></div>

            <div id="dashboard-estado"></div>

            <div id="dashboard-contenido" hidden>
                <!-- cards -->
                <div class="cards">
                    <div class="card">
                        <div>
                            <span class="card-numeros" id="dashboard-clientes">—</span>
                            <span class="card-nombre">Clientes</span>
                        </div>
                        <div class="card-icono">
                            <ion-icon name="people"></ion-icon>
                        </div>
                    </div>
                    <div class="card">
                        <div>
                            <span class="card-numeros" id="dashboard-ventas">—</span>
                            <span class="card-nombre">Ventas obtenidas</span>
                        </div>
                        <div class="card-icono">
                            <ion-icon name="trending-up"></ion-icon>
                        </div>
                    </div>
                    <div class="card">
                        <div>
                            <span class="card-numeros" id="dashboard-ganancias">—</span>
                            <span class="card-nombre">Ganancias</span>
                        </div>
                        <div class="card-icono">
                            <ion-icon name="cash"></ion-icon>
                        </div>
                    </div>
                    <div class="card">
                        <div>
                            <span class="card-numeros" id="dashboard-ticket">—</span>
                            <span class="card-nombre">Ticket promedio</span>
                        </div>
                        <div class="card-icono">
                            <ion-icon name="receipt"></ion-icon>
                        </div>
                    </div>
                </div>
                <!-- fin cards -->

                <!-- detalles -->
                <div class="detalles">
                    <!-- Órdenes Recientes -->
                    <div class="ordenes-recientes">
                        <div class="header">
                            <h2>Ultimas ventas de Campañas</h2>
                            <a href="ventas.html" class="boton">Ver todas</a>
                        </div>
                        <table id="dashboard-ventas-tabla" hidden>
                            <thead>
                                <th>Cliente</th>
                                <th>Precio</th>
                                <th>Servicio</th>
                                <th>Estatus</th>
                            </thead>
                            <tbody id="dashboard-ventas-cuerpo"></tbody>
                        </table>
                    </div>
                    <!-- Fin Órdenes Recientes -->

                    <!-- Nuevos Clientes -->
                    <div class="nuevos-clientes">
                        <div class="header">
                            <h2>Clientes</h2>
                        </div>
                        <table id="dashboard-clientes-tabla" hidden>
                            <thead>
                                <th>Nombre</th>
                                <th>Estatus</th>
                            </thead>
                            <tbody id="dashboard-clientes-cuerpo"></tbody>
                        </table>
                    </div>
                    <!-- Fin Nuevos Clientes -->
                </div>
                <!-- Fin Detalles -->
            </div>
        </div>
        <!-- Fin Dashboard -->
    </section>

    <script type="module" src="/src/index.js"></script>

    <script type="module" src="/src/guard.js"></script>
    <script type="module" src="/src/dashboard.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
