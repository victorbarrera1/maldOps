<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MaldOps</title>
    <link rel="stylesheet" href="src/css/login.css">
</head>

<body>
    <div class="formulario">
        <h1> Login - MaldOps</h1>
        <form id="form-login" action="dashboard.html" novalidate>
            <div class="correo">
                <input type="email" id="correo" name="correo" placeholder=" " autocomplete="email" required
                    aria-describedby="error-correo login-error">
                <label for="correo">Correo electrónico</label>
            </div>
            <p class="campo-error campo-error-campo" id="error-correo" hidden></p>
            <div class="password">
                <input type="password" id="contrasena" name="contrasena" placeholder=" " autocomplete="current-password"
                    required aria-describedby="error-contrasena login-error">
                <label for="contrasena">Contraseña</label>
            </div>
            <p class="campo-error campo-error-campo" id="error-contrasena" hidden></p>
            <p class="login-estado" id="login-estado" role="status" aria-live="polite"></p>
            <div class="campo-error" id="login-error" role="alert" hidden></div>
            <input type="submit" value="Iniciar sesión">
        </form>
        <div class="registro.html">
            <p>¿No tienes cuenta? <a href="registro.html">Regístrate </a></p>
        </div>
    </div>

    <script type="module" src="/src/login.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
