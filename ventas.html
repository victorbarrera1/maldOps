<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body data-privada="true">


    <!--ventas -->
    <div class="container">
        <div id="nav-root"></div>


        <!-- detalles -->
        <div class="detalles">
            <!-- Ultimas ventas -->
            <div class="ordenes-recientes">
                <div class="header">
                    <h2>Ultimas ventas de Campañas <span id="ventas-total" class="badge"></span></h2>
                </div>
                <div id="ventas-estado"></div>
                <table id="ventas-tabla" hidden>
                    <thead>
                        <th>Cliente</th>
                        <th>Precio</th>
                        <th>Servicio</th>
                        <th>Estatus</th>
                    </thead>
                    <tbody id="ventas-cuerpo"></tbody>
                </table>
            </div>
            <!-- Fin Ultimas ventas -->
            <!-- Soporte -->
            <div class="nuevos-clientes">
                <div class="header">
                    <h2> Importar Reportes de Campañas</h2>
                </div>
                <table>
                    <tr>

                        <td>
                            <h4>Importar Reportes de Venta</h4>
                        </td>
                        <td>
                            <button> Importar a Excel</button>

                        </td>
                    </tr>
                    <tr>

                        <td>
                            <h4>Importar Reportes de Campañas mas vendidas</h4>
                        </td>
                        <td>
                            <button> Importar a Excel</button>

                        </td>
                    </tr>
                    <tr>

                        <td>
                            <h4>Importar Historial de Venta</h4>
                        </td>
                        <td>
                            <button> Importar a Excel</button>

                        </td>
                    </tr>

                </table>
            </div>
            <!-- Fin Soporte -->

            </section>

            <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
            <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
            <script type="module" src="js/index.js"></script>

    <script type="module" src="/js/guard.js"></script>
    <script type="module" src="/js/ventas.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>

</html>
