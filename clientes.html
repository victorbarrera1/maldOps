<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="icon" type="image/png" href="img/logo-maldops.png">
    <link rel="stylesheet" href="src/css/dashboard.css">
</head>

<body data-privada="true">
    <!--clientes -->
    <div class="container">
        <div id="nav-root"></div>


        <!-- detalles -->
        <div class="detalles">
            <!-- Clientes activos -->
            <div class="ordenes-recientes">
                <div class="header">
                    <h2>Clientes <span id="clientes-total" class="badge"></span></h2>
                    <button type="button" class="btn btn-primary" id="nuevo-cliente">
                        Nuevo cliente
                    </button>
                </div>
                <!-- [IA] inicio · ia/2026-11-09_manolodeus_favoritos-notas.md -->
                <div class="relative my-3 max-w-sm">
                <label for="clientes-busqueda" class="sr-only">Buscar cliente</label>
                <ion-icon name="search" aria-hidden="true"
                    class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></ion-icon>
                <input type="search" id="clientes-busqueda" placeholder="Buscar por nombre o nota..."
                    class="w-full rounded-full border border-slate-300 bg-white py-2 pl-10 pr-4 text-sm text-slate-800 shadow-sm transition placeholder:text-slate-400 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-500/40 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100">
                </div>

                <div class="my-3">
                <input type="checkbox" id="clientes-solo-favoritos" class="peer sr-only">
                <label for="clientes-solo-favoritos"
                    class="inline-flex cursor-pointer select-none items-center gap-2 rounded-full border border-slate-300 bg-white px-4 py-1.5 text-sm font-medium text-slate-700 shadow-sm transition duration-150 hover:border-amber-400 hover:bg-slate-100 peer-checked:border-amber-500 peer-checked:bg-amber-500 peer-checked:text-slate-900 peer-focus-visible:ring-2 peer-focus-visible:ring-amber-400 peer-focus-visible:ring-offset-2 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 dark:peer-checked:border-amber-500 dark:peer-checked:bg-amber-500 dark:peer-checked:text-slate-900 dark:peer-focus-visible:ring-offset-slate-900">
                <span aria-hidden="true">★</span>
                Solo favoritos
                </label>
                </div>
<!-- [IA] fin -->
                <div id="clientes-estado"></div>
                <table id="clientes-tabla" hidden>
                    <thead>
                        <th>Nombre</th>
                        <th>Estatus</th>
                        <th>Acciones</th>
                    </thead>
                    <tbody id="clientes-cuerpo"></tbody>
                </table>
            </div>
            <!-- Fin Clientes activos -->

            <dialog id="cliente-dialogo" class="modal" aria-labelledby="cliente-dialogo-titulo">
                <form id="cliente-form" novalidate>
                    <h2 id="cliente-dialogo-titulo">Nuevo cliente</h2>
                    <div class="modal-campo">
                        <label class="label" for="cliente-nombre">Nombre</label>
                        <input class="input" type="text" id="cliente-nombre" name="nombre" autocomplete="off">
                        <p class="campo-error" id="cliente-error-nombre" hidden></p>
                    </div>
                    <div class="modal-campo">
                        <label class="label" for="cliente-estatus">Estatus</label>
                        <select class="input" id="cliente-estatus" name="estatus">
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                        <p class="campo-error" id="cliente-error-estatus" hidden></p>
                    </div>
                    <!-- [IA] inicio · ia/2026-11-09_manolodeus_favoritos-notas.md -->
                    <div class="modal-campo">
                     <label class="label" for="cliente-nota">Nota (opcional)</label>
                     <textarea class="input" id="cliente-nota" name="nota" rows="3" maxlength="300"></textarea>
                    <p class="campo-error" id="cliente-error-nota" hidden></p>
                    </div>
                    <!-- [IA] fin -->
                    <p class="campo-error" id="cliente-error-general" hidden></p>
                    <div class="modal-acciones">
                        <button type="button" class="btn" id="cliente-cancelar">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="cliente-guardar">
                            Guardar
                        </button>
                    </div>
                </form>
            </dialog>

            <dialog id="confirmar-dialogo" class="modal" aria-labelledby="confirmar-titulo">
                <form method="dialog">
                    <h2 id="confirmar-titulo">Confirmar eliminación</h2>
                    <p class="estado-detalle" id="confirmar-mensaje"></p>
                    <div class="modal-acciones">
                        <button type="submit" class="btn" value="cancelar">Cancelar</button>
                        <button type="submit" class="btn btn-danger" value="confirmar">Eliminar</button>
                    </div>
                </form>
            </dialog>


    <script type="module" src="/src/guard.js"></script>
    <script type="module" src="/src/clientes.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
